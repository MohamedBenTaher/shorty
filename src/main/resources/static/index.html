<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorty — URL Shortener</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Shorty</h1>
            <p class="subtitle">Paste a long URL, get a short one.</p>
        </header>

        <form id="shorten-form">
            <div class="input-group">
                <input
                    type="url"
                    id="url-input"
                    placeholder="https://example.com/very/long/url"
                    autocomplete="off"
                    autofocus
                >
                <button type="submit">Shorten</button>
            </div>
            <p class="error" id="error"></p>
        </form>

        <div class="result hidden" id="result">
            <p class="result-label">Your shortened URL</p>
            <div class="result-row">
                <input type="text" id="short-url" readonly>
                <button id="copy-btn" title="Copy to clipboard">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                    </svg>
                </button>
            </div>
            <span class="copied" id="copied-msg">Copied!</span>
        </div>
    </div>

    <footer>
        <p>Shorty &mdash; dead simple URL shortener</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
